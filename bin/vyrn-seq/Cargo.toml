[package]
name = "vyrn-seq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "The sequencer binary: main.rs and config wiring only."

# 11 §1.3 links vyrn-engine (live), vyrn-nic, vyrn-log, vyrn-consensus (proposer) and vyrn-epoch.
# The engine's lane, BBO, cut, risk and wire types are named here because Engine::new takes a
# lane constructor (vyrn-engine does not depend on vyrn-risk, 11 §1.4).
[dependencies]
vyrn-types = { workspace = true }
vyrn-crypto = { workspace = true }
vyrn-wire = { workspace = true }
vyrn-cut = { workspace = true }
vyrn-risk = { workspace = true }
vyrn-bbo = { workspace = true }
vyrn-lane = { workspace = true }
vyrn-engine = { workspace = true }
vyrn-nic = { workspace = true }
vyrn-log = { workspace = true }
vyrn-epoch = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
vyrn-replica = { workspace = true }
vyrn-consensus = { workspace = true }
