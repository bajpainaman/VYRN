# vyrn-sim seeds that once failed; each runs on every commit (spec/11-build.md §6.4).
#
# Format (tools/sim-swarm): each [[seed]] has `seed` (hex), optional `faults` (a schedule in
# vyrn_sim::cluster::Schedule's text form; absent = the seed's own) and `expect`: "pass" or the
# check it fails today. `known` lists checks with an open engine bug: a swarm seed that fails one
# of them is reported as known, not failed. When a fix lands, set the seeds' `expect` to "pass"
# and remove the check from `known`.
known = []

[[seed]]
seed = "1e"
# Required: failed BBO-QUIESCE (vyrn-bbo Rescan livelock, crossed snapshot) before #84; guards that fix.
faults = ""
expect = "pass"

[[seed]]
seed = "4"
# Required: failed ENGINE-FAULT (vyrn-lane settle.rs:177) before ad180b7 (#45); guards that fix.
faults = "bbo-stall 27099 90261"
expect = "pass"

[[seed]]
seed = "3"
expect = "pass"

[[seed]]
seed = "a"
# Required: failed INV-UNCROSSED (bid 102 ask 101 at step 280) when lanes read the BBO snapshot
# only at boundaries (stale snapshots; the 05 §8.5 band_env open item). Guards read-at-accept
# with a logged snap_lag (05 §6.5).
faults = "delay 73 15166; dup 65; delay 2 44940"
expect = "pass"

[[seed]]
seed = "6f"
# Required: replay's lowver (05 §8.6, 07 §3.8 LOWVER) changes its output. With replay ignoring
# the logged mask, or taking envelope(0) for every advanced lane, its band reset publishes other
# bounds and snapshot versions than live, and record 392 names a version replay never published
# (INV-DET: NoSnapshot). Guards that LOWVER is an input to replay, not only a check.
faults = "drop 31"
expect = "pass"
