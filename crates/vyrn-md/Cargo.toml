[package]
name = "vyrn-md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "Market data and drop copy from replay events."

[[bin]]
name = "vyrn-md"
path = "src/bin/vyrn-md.rs"

[[bin]]
name = "vyrn-dropcopy"
path = "src/bin/vyrn-dropcopy.rs"

[dependencies]
vyrn-types = { workspace = true }
# vyrn-replica (11 §1.4 layer 6) returns when its replay core lands; until then the replica
# implements `ReplayStream` (src/stream.rs) and nothing here links it.
vyrn-nic = { workspace = true }
vyrn-wire = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
