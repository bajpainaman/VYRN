[package]
name = "vyrn-md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "Market data and drop copy from replay events."

[[bin]]
name = "vyrn-md"
path = "src/bin/vyrn-md.rs"

[[bin]]
name = "vyrn-dropcopy"
path = "src/bin/vyrn-dropcopy.rs"

[dependencies]
vyrn-types = { workspace = true }
# Layer 7 (11 §1.4): vyrn-replica (6) drives `SinkStream` (src/replay.rs) through `RustReplay`.
vyrn-replica = { workspace = true }
vyrn-nic = { workspace = true }
vyrn-wire = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# tests/replay.rs runs the engine's test harness (included by path) live and through the replica.
vyrn-engine = { workspace = true }
vyrn-bbo = { workspace = true }
vyrn-cut = { workspace = true }
vyrn-lane = { workspace = true }
vyrn-risk = { workspace = true }
vyrn-log = { workspace = true }
vyrn-crypto = { workspace = true }

[lints]
workspace = true
