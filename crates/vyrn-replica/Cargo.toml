[package]
name = "vyrn-replica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "The replica: two-path order frames, data fetch, replay engine (Rust or Vx), state roots, votes."

# Layer 6 (spec/11-build.md §1.4): vyrn-engine (4) for replay payloads, vyrn-epoch (5) for the
# handoff, vyrn-consensus (4) and vyrn-log (2).
[dependencies]
vyrn-types = { workspace = true }
vyrn-crypto = { workspace = true }
vyrn-engine = { workspace = true }
vyrn-epoch = { workspace = true }
vyrn-wire = { workspace = true }
vyrn-consensus = { workspace = true }
vyrn-log = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus-client = { workspace = true }
thiserror = { workspace = true }

