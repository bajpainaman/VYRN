# git-cliff (deploy/release/changelog.sh). Commits here are "<area>: <what>", not Conventional
# Commits, so every commit is kept and listed under its subject line; merge commits are dropped.
[changelog]
header = ""
body = """
## {% if version %}{{ version }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}Unreleased{% endif %}

{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^Merge (pull request|branch)", skip = true },
  { message = "^release: ", skip = true },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
