# 02 §6.3, §6.4: MM, the top 17 firms on dedicated lanes 0-41, 6 sessions per lane.
[[class]]
kind = "mm"
enabled = true
placement = { kind = "dedicated", lane_first = 0, lane_count = 42, sessions_per_lane = 6 }
skew = { kind = "equal" }
mix = { join = 490_000, cancel = 442_000, reduce = 20_000, improve = 15_500, cross = 2_500 }
qty_p_ppm = 200_000
stp_cancel_newest = true
bursty = true
packets = { kind = "bundled", bundle_size = 10, urgent_cancel_ppm = 50_000, urgent_two_ppm = 500_000 }

# TK: active takers, Zipf(s = 0.5), pooled.
[[class]]
kind = "tk"
placement = { kind = "pooled", sessions = 4000 }
skew = { kind = "zipf", s_milli = 500 }
mix = { join = 8_000, cancel = 6_500, reduce = 0, improve = 4_000, cross = 6_500 }
qty_p_ppm = 200_000
bursty = true
packets = { kind = "single", two_ppm = 200_000 }

# RT: retail and slow clients, uniform, pooled.
[[class]]
kind = "rt"
placement = { kind = "pooled", sessions = 24000 }
skew = { kind = "equal" }
mix = { join = 2_000, cancel = 1_500, reduce = 0, improve = 500, cross = 1_000 }
qty_p_ppm = 500_000
