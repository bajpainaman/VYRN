# VYRN workspace (spec/11-build.md §1). Every external dependency is on the §2.2 allowlist and
# pinned with "=x.y.z" (§2.6); crates name it with `workspace = true` and never a version.
[workspace]
resolver = "3"
members = ["crates/engine/*", "crates/vyrn-*", "bin/*", "tools/*"]
# fuzz/ is a cargo-fuzz package outside the workspace (§6.6).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE"

[workspace.dependencies]
# Internal crates (§1.3, graph §1.4). A library crate with its own version (deploy/release/README.md)
# also carries `version` here, which `cargo package` needs; cargo-release keeps it in step.
vyrn-types = { path = "crates/engine/vyrn-types", version = "0.1.0" }
vyrn-crypto = { path = "crates/engine/vyrn-crypto", version = "0.1.0" }
vyrn-wire = { path = "crates/engine/vyrn-wire", version = "0.1.0" }
vyrn-cut = { path = "crates/engine/vyrn-cut" }
vyrn-risk = { path = "crates/engine/vyrn-risk" }
vyrn-bbo = { path = "crates/engine/vyrn-bbo" }
vyrn-lane = { path = "crates/engine/vyrn-lane" }
vyrn-engine = { path = "crates/engine/vyrn-engine" }
vyrn-nic = { path = "crates/vyrn-nic" }
vyrn-log = { path = "crates/vyrn-log" }
vyrn-data = { path = "crates/vyrn-data" }
vyrn-consensus = { path = "crates/vyrn-consensus" }
vyrn-epoch = { path = "crates/vyrn-epoch" }
vyrn-replica = { path = "crates/vyrn-replica" }
vyrn-chain = { path = "crates/vyrn-chain" }
# Test-only (§1.4): tools/sim-swarm drives it.
vyrn-sim = { path = "crates/vyrn-sim" }
# Tier T: tools/e2e-smoke drives its generator.
vyrn-bench = { path = "crates/vyrn-bench" }

# Tier E: engine crates may use these.
blake3 = "=1.8.7"
zerocopy = { version = "=0.8.63", features = ["derive"] }

# Tier S: other production crates.
curve25519-dalek = "=5.0.0"
# "digest" re-exports SHA-512 for the ZIP-215 verifier in vyrn-crypto.
ed25519-dalek = { version = "=3.0.0", features = ["digest"] }
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
k256 = "=0.14.0"
# Drop-copy Noise transport (10 §8.5 item 5): ChaCha20-Poly1305 and SHA-512. Both are already in
# the graph through commonware-cryptography and ed25519-dalek; defaults off (no getrandom/alloc).
chacha20poly1305 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
# Keccak-256 for L1-facing code only (01 §14.11). keccak 0.2 picks the ARMv8 SHA3 backend at run time
# (cpufeatures) and falls back to portable code, so no target feature is set. Defaults off: no OID.
sha3 = { version = "=0.11.0", default-features = false }
# All commonware-* crates move together on one release tag (§2.6).
commonware-consensus = "=2026.10.0"
commonware-p2p = "=2026.10.0"
commonware-runtime = "=2026.10.0"
commonware-cryptography = "=2026.10.0"
commonware-codec = "=2026.10.0"
commonware-storage = "=2026.10.0"
commonware-utils = "=2026.10.0"
commonware-parallel = "=2026.10.0"
commonware-actor = "=2026.10.0"
commonware-stream = "=2026.10.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
libc = "=0.2.191"
cc = "=1.11.2"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.1"
clap = { version = "=4.6.7", features = ["derive"] }
prometheus-client = "=0.26.0"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
thiserror = "=2.0.21"
# default-features off drops the "sync" feature and its crossbeam-channel dependency (§2.2 ban).
hdrhistogram = { version = "=7.6.0", default-features = false }

# Tier T: tests, vyrn-sim, vyrn-bench, fuzz/ and tools/ only.
proptest = "=1.12.0"
loom = "=0.7.3"
rand = "=0.10.4"
rand_chacha = "=0.10.0"
# tools/ only: the CI gates lex Rust (unsafe-audit, lint-engine) and read `cargo metadata`
# (lint-engine). Neither is on the §2.2 allowlist; both are already in Cargo.lock.
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde_json = "=1.0.154"

# Release framework (deploy/release/README.md). The workspace version above is the version of the
# final package (§9.5); a library crate that sets its own `version` is released on its own as well.
# The protocol version is vyrn-wire's PROTO_VERSION (§10.2 keeps it apart from the release version).
[workspace.metadata.vyrn]
# §10.1's config schema. deploy/schema/ is empty, so no schema is defined yet: 0.
config_schema_version = 0

# cargo-release, per-crate releases only. GitHub Releases, never crates.io: every crate is
# `publish = false` under the LICENSE.
[workspace.metadata.release]
publish = false
push = false
tag-name = "{{crate_name}}-v{{version}}"
pre-release-commit-message = "release: bump crate versions"
pre-release-hook = ["sh", "-c", "exec \"$WORKSPACE_ROOT/deploy/release/changelog.sh\" \"$CRATE_NAME\" \"$NEW_VERSION\""]
dependent-version = "upgrade"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# §3.4: overflow checks in every profile, abort on panic, one codegen unit.
[profile.release]
opt-level = 3
codegen-units = 1
debug = "line-tables-only"
overflow-checks = true
panic = "abort"
incremental = false

[profile.bench]
inherits = "release"
