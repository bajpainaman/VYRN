# VYRN Ethereum L1 custody and bridge contract (spec/09-chain.md §6, §7, REQ-CHN-6).
# spec/11-build.md §1.2 names no place for Solidity, so the Foundry project lives in contracts/.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./vectors" }]
gas_reports = ["VyrnBridge"]

[fuzz]
runs = 256
seed = "0x5652594e"

[profile.ci.fuzz]
runs = 128

[fmt]
line_length = 110
ignore = ["src/Blake3.sol", "src/SmtEmpty.sol"]

[lint]
lint_on_build = false
