# WL-SMOKE: the e2e smoke workload (tools/e2e-smoke). Two dedicated lanes of a vyrn-seq DEV box
# (book 7, epoch 0, ticks 1-512 around 100), two MM sessions per lane, no pooled classes (pooled
# lanes are not wired in vyrn-seq). Schema: bench/workloads/FORMAT.md. Not a 02 §6 workload.
version = 1
id = "WL-SMOKE"
mode = "base"
book = 7
epoch16 = 0
rate_msgs_per_s = 10_000

[book_model]
mid_tick = 100
spread_ticks = 2
depth_lots = 5

# No bursts: base rates unscaled.
[burst]
rate_per_s = 0
window_ns = 1
mult_ppm = 1_000_000
base_scale_ppm = 1_000_000

[lifetimes]
replace_ppm = 115_000

[[lifetimes.row]]
ppm = 700_000
lo_ns = 100_000
hi_ns = 2_000_000

[[lifetimes.row]]
ppm = 300_000
lo_ns = 2_000_000
hi_ns = 50_000_000

[[join_distance]]
kind = "fixed"
ppm = 500_000
d = 0

[[join_distance]]
kind = "geometric"
ppm = 500_000
base = 1
cap = 6
p_ppm = 400_000

[[cross_levels]]
ppm = 800_000
lo = 1
hi = 1

[[cross_levels]]
ppm = 200_000
lo = 2
hi = 3

[cross]
ioc_ppm = 700_000
day_ppm = 250_000
fok_ppm = 50_000
through_ppm = 4_000
through_qty_pct = 120

[[phase]]
duration_ns = 600_000_000_000
rate_ppm = 1_000_000

[[class]]
kind = "mm"
enabled = true
placement = { kind = "dedicated", lane_first = 0, lane_count = 2, sessions_per_lane = 2 }
skew = { kind = "equal" }
mix = { join = 450_000, cancel = 300_000, reduce = 20_000, improve = 30_000, cross = 200_000 }
qty_p_ppm = 300_000
stp_cancel_newest = true
packets = { kind = "single", two_ppm = 200_000 }
