# spec/11-build.md §4.3. clang and lld must share rustc's LLVM major (§4.2); .agents/setup installs
# them into /usr/local/bin.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "linker-plugin-lto", "-C", "link-arg=-fuse-ld=lld",
             "-C", "target-cpu=x86-64-v3", "-C", "force-frame-pointers=yes"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "linker-plugin-lto", "-C", "link-arg=-fuse-ld=lld",
             "-C", "target-cpu=neoverse-n1", "-C", "force-frame-pointers=yes"]

# §2.6: once `cargo vendor` has written vendor/, uncomment this so builds run --offline.
