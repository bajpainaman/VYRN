# spec/11-build.md §4.3. Release and bench builds add cross-language LTO on top of
# .cargo/config.toml (Cargo joins the two rustflags arrays):
#   cargo release    (alias for cargo build --release --config .cargo/release.toml)
# Debug builds leave it out. vyrn-nic's build script rejects a release build of the C shim without it.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "linker-plugin-lto"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "linker-plugin-lto"]
