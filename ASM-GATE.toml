# rte_eth_rx_burst dispatches through the port's ops table, so this one is expected to report an
# indirect call; §4.4 then allowlists that call by name with its B1 cost, once 06 decides.
[[symbol]]
name = "vyrn_dpdk_rx_burst"
forbid_calls = ["vyns_*", "rte_*", "__rust_alloc*", "*panic_bounds_check*", "*panic_fmt*"]
forbid_indirect_calls = true
