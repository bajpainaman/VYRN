forbid_calls = ["__rust_alloc*", "__rust_dealloc", "__rust_realloc", "*panic_bounds_check*", "*panic_fmt*"]
forbid_indirect_calls = true

[[symbol]]
name = "vyrn_lane_classify"
forbid_calls = ["__rust_alloc*", "__rust_dealloc", "__rust_realloc", "*panic_bounds_check*", "*panic_fmt*"]
forbid_indirect_calls = true

[[symbol]]
name = "vyrn_order_drain"          # stream cores 4 and 7
forbid_calls = ["__rust_alloc*", "__rust_dealloc", "__rust_realloc", "*panic_bounds_check*", "*panic_fmt*"]
forbid_indirect_calls = true

[[symbol]]
