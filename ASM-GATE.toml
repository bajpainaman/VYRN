# Hot symbols and the callees they must not contain (spec/11-build.md §4.4). Read by
# tools/asm-gate (schema 1, see its lib.rs): `*` in a pattern matches any run of characters.
schema = 1

[[symbol]]
name = "vyrn_lane_rx_batch"
forbid_calls = ["vyns_*", "ef_*", "rte_*", "__rust_alloc*", "__rust_dealloc", "__rust_realloc",
                "*panic_bounds_check*", "*slice_index_fail*", "*panic_fmt*"]
forbid_indirect_calls = true
max_bytes = 6144

[[symbol]]
name = "vyrn_tx_ctpio_send"
forbid_calls = ["vyns_*", "ef_*", "__rust_alloc*"]
forbid_indirect_calls = true

[[symbol]]
name = "vyrn_bbo_step"
forbid_calls = ["__rust_alloc*", "*panic_bounds_check*", "*panic_fmt*"]
forbid_indirect_calls = true

# The rest of §4.4's list. §4.4 names these symbols but not their forbidden callees, so each gets
# the no-allocation, no-panic set that every hot wrapper above shares, plus the vendor prefixes for
# the NIC wrapper. Tighten per symbol when its crate lands.
[[symbol]]
name = "vyrn_cut_publish"          # both cut cores
forbid_calls = ["__rust_alloc*", "__rust_dealloc", "__rust_realloc", "*panic_bounds_check*", "*panic_fmt*"]
forbid_indirect_calls = true

[[symbol]]
name = "vyrn_siphash_pkt"
forbid_calls = ["__rust_alloc*", "__rust_dealloc", "__rust_realloc", "*panic_bounds_check*", "*panic_fmt*"]
forbid_indirect_calls = true

[[symbol]]
