# The final package (spec/11-build.md §9.4–9.5, deploy/release/README.md): release binaries per
# architecture, each built twice and compared, SBOMs, toolchain hashes and an unsigned
# manifest.toml, as a draft GitHub Release. Maintainers sign the manifest offline (2 of 3) and
# publish the draft; CI holds no release key.
# Runs on a `v<version>` tag push, or by hand in dry-run mode (the default), which uploads the
# bundle as a workflow artifact only.
name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; publish nothing
        type: boolean
        default: true
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build twice (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/llvm
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-cyclonedx@0.5.10
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false # build.sh uses its own target directories
      - run: deploy/release/build.sh "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  bundle:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release create --draft, only when not a dry run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog reads the history since the last v* tag
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/llvm
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: git-cliff@2.14.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Manifest
        id: manifest
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(deploy/release/meta.sh version)"
          tag="v$version"
          # `inputs` is empty only on a direct tag push; a caller's push reaches a called
          # workflow too, so the event name cannot tell a tag release from a dry run.
          dry_run="${INPUT_DRY_RUN:-false}"
          if [[ "$dry_run" == false ]]; then
            if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "a release needs the tag $tag; this is $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi
          deploy/release/changelog.sh vyrn "$version" >dist/CHANGELOG.md
          cargo metadata --format-version 1 --no-deps --locked |
            jq -r '.packages[] | "\(.name) \(.version)"' >"$RUNNER_TEMP/crates.txt"
          cargo run --quiet --locked -p repro-build -- manifest dist kind=workspace name=vyrn \
            version="$version" tag="$tag" commit="$(git rev-parse HEAD)" \
            source_date_epoch="$(git log -1 --format=%ct)" \
            protocol_version="$(deploy/release/meta.sh protocol_version)" \
            config_schema_version="$(deploy/release/meta.sh config_schema_version)" \
            crates="$RUNNER_TEMP/crates.txt"
          cargo run --quiet --locked -p vyrn-admin -- release verify dist --unsigned
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
      - name: Draft GitHub Release (unsigned until maintainers sign it)
        if: steps.manifest.outputs.dry_run == 'false' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "VYRN $TAG" \
            --notes-file dist/CHANGELOG.md dist/*
