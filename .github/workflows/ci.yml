# S1 of spec/11-build.md §8, the parts that exist today: formatting, clippy, tests on Linux
# x86-64 and aarch64 (macOS is left out to keep CI cheap), cargo-deny, the 04 §11 protocol
# vectors, and the unsafe-audit, lint-engine, shim-gate and vx-friction gates (Linux only, §9.2
# S1). Miri, TSan, fuzzing and the asm gate (S2, it needs the §4.4 hot wrappers in a release
# vyrn-seq) join as the crates they cover land; perf-gate runs on the lab runners (§9.3). Third-party actions are pinned to a
# commit, with the tag it was taken from in a comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/llvm # clang and lld with rustc's LLVM major (11 §4.2)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: vyrn-nic against the C shim, which checks its ABI version (06 §7.5)
        run: cargo test --locked -p vyrn-nic --features shim
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        if: matrix.os == 'ubuntu-24.04'
        with:
          tool: git-cliff@2.14.2
      - name: per-crate release dry run (deploy/release/README.md)
        if: matrix.os == 'ubuntu-24.04'
        run: deploy/release/crate.sh vyrn-wire "$RUNNER_TEMP/crate-bundle"

  gates:
    name: gates (unsafe-audit, lint-engine, shim-gate, vx-friction)
    runs-on: ubuntu-24.04
    env:
      # These two tools need no clang or lld, so build them with the runner's cc and without the
      # workspace's linker-plugin-lto rustflags (.cargo/config.toml, §4.3). RUSTFLAGS in the
      # environment replaces the config's rustflags.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: unsafe only in the modules of UNSAFE.toml (11 §3.2, REQ-SEC-10)
        run: cargo run --locked --quiet -p unsafe-audit
      - name: engine crates keep to the dependency DAG and the engine source rules (11 §1.4, §2.3, §3.3)
        run: cargo run --locked --quiet -p lint-engine
      - name: the C shim stays within 300 code lines (11 §4.5, 01 §9)
        run: cargo run --locked --quiet -p shim-gate
      - name: every Vx workaround marker matches its vx/FRICTION.md entry (11 §5.6)
        run: cargo run --locked --quiet -p vx-friction

  sim-swarm:
    name: vyrn-sim swarm (11 §6.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/llvm # clang and lld with rustc's LLVM major (11 §4.2)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: 500 fixed seeds (BLD_SIM_SEEDS_PR), tests/seeds.toml, one seed run twice
        run: cargo run --locked --release --quiet -p sim-swarm -- --start 1 --seeds 500 --jobs 4
      - name: the SF-24 canary fails INV-DET on every seed that reaches replay
        run: cargo run --locked --release --quiet -p sim-swarm -- --start 1 --seeds 100 --jobs 4 --canary

  e2e-smoke:
    name: e2e smoke (vyrn-seq, vyrn-validator, replay tap)
    runs-on: ubuntu-24.04
    # Bounded three ways: the job, the step's timeout(1), and the harness's per-wait deadline.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/llvm # clang and lld with rustc's LLVM major (11 §4.2)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Release: a debug validator can take longer than REP_HASHLAG_MAX_NS (1 ms) on one frame.
      - run: cargo build --locked --release -p vyrn-seq -p vyrn-validator -p vyrn-data-box -p vyrn-md -p e2e-smoke
      - name: 4 validators with finality, an observer and vyrn-dropcopy, WL-SMOKE-NOCROSS seed 1 (tools/e2e-smoke)
        run: timeout 300 target/release/e2e-smoke --validators 4 --wait-s 30 --seq-cpus 0,1 --validator-cpus 2,3 --data --finality --dropcopy --dev-hashlag-us 50000 --strict-hashlag --workload tools/e2e-smoke/wl-smoke-nocross.toml
      - name: 4 validators with finality, the tap's data socket losing every 25th frame, WL-SMOKE-NOCROSS seed 1 (tools/e2e-smoke R14)
        run: timeout 300 target/release/e2e-smoke --validators 4 --wait-s 30 --seq-cpus 0,1 --validator-cpus 2,3 --data --finality --dev-hashlag-us 50000 --strict-hashlag --tap-loss 25 --workload tools/e2e-smoke/wl-smoke-nocross.toml
      - name: 4 validators with finality, keyed data box, WL-SMOKE-NOCROSS seed 1 (tools/e2e-smoke R7)
        run: timeout 300 target/release/e2e-smoke --validators 4 --wait-s 30 --seq-cpus 0,1 --validator-cpus 2,3 --data --finality --dev-hashlag-us 50000 --strict-hashlag --keyed --workload tools/e2e-smoke/wl-smoke-nocross.toml
      - name: 4 validators with finality, keyed data box on 2 ingest shards, WL-SMOKE-NOCROSS seed 1 (tools/e2e-smoke R7, R10)
        run: timeout 300 target/release/e2e-smoke --validators 4 --wait-s 30 --seq-cpus 0,1 --validator-cpus 2,3 --data --finality --dev-hashlag-us 50000 --strict-hashlag --keyed --data-shards 2 --workload tools/e2e-smoke/wl-smoke-nocross.toml
      - name: 4 validators with finality, keyed home and backup data boxes, the home killed mid-run, WL-SMOKE-NOCROSS seed 1 (tools/e2e-smoke R12)
        run: timeout 300 target/release/e2e-smoke --validators 4 --wait-s 30 --seq-cpus 0,1 --validator-cpus 2,3 --data --finality --dev-hashlag-us 50000 --strict-hashlag --keyed --data-kill --workload tools/e2e-smoke/wl-smoke-nocross.toml
      - name: 4 validators with finality, an observer and vyrn-dropcopy, WL-SMOKE seed 1 (tools/e2e-smoke)
        run: timeout 300 target/release/e2e-smoke --validators 4 --wait-s 30 --seq-cpus 0,1 --validator-cpus 2,3 --data --finality --dropcopy --dev-hashlag-us 50000 --strict-hashlag
      - name: 4 validators and an observer on two replication paths, vyrn-dropcopy, WL-SMOKE-NOCROSS seed 1 (tools/e2e-smoke R12)
        run: timeout 300 target/release/e2e-smoke --validators 4 --wait-s 30 --seq-cpus 0,1 --validator-cpus 2,3 --data --finality --dropcopy --two-path --dev-hashlag-us 50000 --strict-hashlag --workload tools/e2e-smoke/wl-smoke-nocross.toml
      - name: observer path B loses one frame and sequencer retransmit repairs it, WL-SMOKE-NOCROSS seed 1 (tools/e2e-smoke R12, R14)
        run: timeout 300 target/release/e2e-smoke --validators 4 --wait-s 30 --seq-cpus 0,1 --validator-cpus 2,3 --data --finality --dropcopy --drop-path-b 300 --dev-hashlag-us 50000 --strict-hashlag --workload tools/e2e-smoke/wl-smoke-nocross.toml
      - name: observer path B loses one frame and every retransmit, so it holds the block, WL-SMOKE-NOCROSS seed 1 (tools/e2e-smoke R14)
        run: timeout 300 target/release/e2e-smoke --validators 4 --wait-s 30 --seq-cpus 0,1 --validator-cpus 2,3 --data --finality --dropcopy --drop-path-b 300 --drop-rtx --dev-hashlag-us 50000 --strict-hashlag --workload tools/e2e-smoke/wl-smoke-nocross.toml
      - name: validator 0 path A loses one frame, repaired, finalizes through the last block, WL-SMOKE-NOCROSS seed 1 (tools/e2e-smoke R14)
        run: timeout 300 target/release/e2e-smoke --validators 4 --wait-s 30 --seq-cpus 0,1 --validator-cpus 2,3 --data --finality --drop-path-a 300 --dev-hashlag-us 50000 --strict-hashlag --workload tools/e2e-smoke/wl-smoke-nocross.toml

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint 1.7.12
        run: |
          # The release tarball itself, checked against its sha256 from the release's
          # checksums.txt (CDPI S9): upstream's download script pipes an unchecked tarball to tar.
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c --quiet -
          tar -xzf /tmp/actionlint.tar.gz actionlint
          ./actionlint -color

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: cargo deny check

  vectors:
    name: protocol vectors (04 §11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: script output equals the committed golden files
        working-directory: /tmp
        run: |
          python3 -I "$GITHUB_WORKSPACE/tests/golden/vyrn_proto_vectors.py" | diff - "$GITHUB_WORKSPACE/tests/golden/vyrn_proto_vectors.out"
          python3 -I "$GITHUB_WORKSPACE/tests/golden/vyrn_reject_vectors.py" | diff - "$GITHUB_WORKSPACE/tests/golden/vyrn_reject_vectors.out"
          python3 -I "$GITHUB_WORKSPACE/tests/golden/vyrn_log_vectors.py" | diff - "$GITHUB_WORKSPACE/tests/golden/vyrn_log_vectors.out"
          python3 -I "$GITHUB_WORKSPACE/tests/golden/vyrn_admin_vectors.py" | diff - "$GITHUB_WORKSPACE/tests/golden/vyrn_admin_vectors.out"
          python3 -I "$GITHUB_WORKSPACE/tests/golden/vyrn_session_vectors.py" | diff - "$GITHUB_WORKSPACE/tests/golden/vyrn_session_vectors.out"
          python3 -I "$GITHUB_WORKSPACE/tests/golden/vyrn_data_vectors.py" | diff - "$GITHUB_WORKSPACE/tests/golden/vyrn_data_vectors.out"
          python3 -I "$GITHUB_WORKSPACE/tests/golden/vyrn_nack_vectors.py" | diff - "$GITHUB_WORKSPACE/tests/golden/vyrn_nack_vectors.out"
          # The JSON form of the same vectors (tests/golden/README.md).
          for v in proto log session data admin reject nack; do
            python3 -I "$GITHUB_WORKSPACE/tests/golden/vyrn_${v}_vectors.py" --json | diff - "$GITHUB_WORKSPACE/tests/golden/vyrn_${v}_vectors.json"
          done
      - name: derive_key and signing contexts are spelled the same in spec and code
        run: python3 -I tools/check-contexts.py
      # gen_dc_vectors.py and gen_feed_vectors.py take BLAKE3 from the b3sum CLI, which the
      # runner lacks; .agents/setup installs the same tool for orbs.
      - name: install b3sum
        working-directory: /tmp
        run: cargo install b3sum --locked --version 1.8.7
      - name: the vyrn-md generators rewrite their vectors unchanged (10 §8.5, #92)
        run: |
          for gen in gen_feed_vectors gen_dc_vectors gen_dc_noise_vectors gen_dc_stmt_vectors; do
            python3 -I "crates/vyrn-md/tests/$gen.py" crates/vyrn-md/tests
          done
          git diff --exit-code -- crates/vyrn-md/tests
      - name: the independent trace decoder rewrites the trace-dump vectors unchanged (11 §8.3)
        run: |
          python3 -I tools/trace-dump/fixtures-src/make.py
          git diff --exit-code -- tools/trace-dump/fixtures

  contracts:
    name: L1 bridge contracts (09 §6)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.9.0
      - run: forge fmt --check
      - run: forge build --sizes
      - run: FOUNDRY_PROFILE=ci forge test --gas-report
